<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="system-ui, 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">同一条工单如何变成一个可执行决定</title>
  <desc id="desc">应用收集工单状态并提出三个问题，模型返回结构化判断，业务代码再依据规则决定分流或转人工。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#557087"/>
    </marker>
  </defs>
  <rect width="520" height="430" rx="20" fill="#f3f7fb"/>
  <text x="28" y="39" fill="#182c44" font-size="23" font-weight="700">一条工单，两道分工</text>
  <g stroke="#c8d5e3" fill="#fff">
    <rect x="28" y="60" width="464" height="63" rx="12"/>
    <rect x="28" y="156" width="464" height="67" rx="12" fill="#dcecff" stroke="#9fc0e9"/>
    <rect x="28" y="256" width="464" height="67" rx="12" fill="#d9f4ea" stroke="#92cab8"/>
    <rect x="28" y="356" width="224" height="50" rx="12"/>
    <rect x="268" y="356" width="224" height="50" rx="12" fill="#fff1db" stroke="#dfbf8c"/>
  </g>
  <g fill="#182c44" font-size="19" font-weight="700">
    <text x="46" y="85">输入材料</text>
    <text x="46" y="182">模型判断</text>
    <text x="46" y="282">代码决定</text>
    <text x="140" y="388" text-anchor="middle">普通工单队列</text>
    <text x="380" y="388" text-anchor="middle">人工复核队列</text>
  </g>
  <g fill="#3b536b" font-size="17">
    <text x="46" y="109">「付款成功了，但订单一直没生成。」</text>
    <text x="46" y="208">归哪类？影响多大？是否提到重复扣款？</text>
    <text x="46" y="308">检查输入与结果，再应用阈值和业务规则</text>
  </g>
  <g fill="none" stroke="#557087" stroke-width="2" marker-end="url(#arrow)">
    <path d="M260 125 V151"/><path d="M260 225 V251"/>
    <path d="M260 325 V338 H140 V351"/><path d="M260 325 V338 H380 V351"/>
  </g>
</svg>
