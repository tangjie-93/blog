<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="system-ui, 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">三组阈值的复核量和漏报量</title>
  <desc id="desc">100 条教学样本中，阈值 0.55 时复核 42 条、漏报 1 条，0.70 时复核 28 条、漏报 3 条，0.85 时复核 18 条、漏报 7 条。</desc>
  <rect width="520" height="350" rx="20" fill="#f3f7fb"/>
  <text x="25" y="40" fill="#182c44" font-size="23" font-weight="700">提高阈值，少审也可能多漏</text>
  <text x="25" y="67" fill="#3b536b" font-size="16">100 条教学样本 · 分数达到阈值就复核</text>
  <circle cx="32" cy="96" r="6" fill="#2458a5"/><text x="45" y="102" fill="#182c44" font-size="16">送审工单</text>
  <circle cx="152" cy="96" r="6" fill="#a94f22"/><text x="165" y="102" fill="#182c44" font-size="16">未送审的真阳性</text>
  <path d="M124 125 V303 M199 125 V303 M274 125 V303 M349 125 V303 M424 125 V303" fill="none" stroke="#d4dfeb"/>
  <g fill="#182c44" font-size="18" text-anchor="end">
    <text x="104" y="155">0.55</text><text x="104" y="220">0.70</text><text x="104" y="285">0.85</text>
  </g>
  <g fill="#2458a5"><rect x="124" y="129" width="315" height="20" rx="4"/><rect x="124" y="194" width="210" height="20" rx="4"/><rect x="124" y="259" width="135" height="20" rx="4"/></g>
  <g fill="#a94f22"><rect x="124" y="153" width="7.5" height="15" rx="3"/><rect x="124" y="218" width="22.5" height="15" rx="3"/><rect x="124" y="283" width="52.5" height="15" rx="3"/></g>
  <g fill="#182c44" font-size="16">
    <text x="447" y="145">42</text><text x="140" y="166">1</text><text x="342" y="210">28</text><text x="155" y="231">3</text><text x="267" y="275">18</text><text x="185" y="296">7</text>
  </g>
  <g fill="#3b536b" font-size="14" text-anchor="middle">
    <text x="124" y="325">0</text><text x="199" y="325">10</text><text x="274" y="325">20</text><text x="349" y="325">30</text><text x="424" y="325">40</text>
  </g>
  <text x="463" y="325" fill="#3b536b" font-size="14">条</text>
</svg>
